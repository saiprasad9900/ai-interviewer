# Render.com — deploy FastAPI backend from GitHub
# Dashboard: New → Blueprint → connect this repo
services:
  - type: web
    name: ai-interviewer-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_DIR
        value: /tmp/ai_interviewer_data
